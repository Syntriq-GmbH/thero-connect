name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o thero-connect.exe .
      - run: GOOS=windows GOARCH=arm64 go vet ./...
      - run: GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -o thero-connect-arm64.exe .
      - run: go vet -tags e2e ./...

  windows:
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
